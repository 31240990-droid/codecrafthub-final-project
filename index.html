<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeCraftHub - Learning Dashboard</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fb;margin:0;padding:20px}
h1{color:#4a3aff}
.card{background:#fff;padding:15px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.1);margin-bottom:15px}
#courseList{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}
.course{border:1px solid #ddd;border-radius:8px;padding:12px;background:#fff}
.course h3{margin:0 0 8px}
button{background:#4a3aff;color:#fff;border:none;padding:8px 12px;border-radius:5px;cursor:pointer;margin-right:5px}
button.delete{background:#e63946}
form{background:#fff;padding:15px;border-radius:8px;margin-bottom:20px}
input,textarea{width:100%;padding:8px;margin:6px 0;border:1px solid #ccc;border-radius:5px}
#editModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5)}
#editBox{background:#fff;padding:20px;border-radius:8px;width:300px;margin:100px auto}
</style>
</head>
<body>
<h1>CodeCraftHub: Your Learning Management Platform</h1>
<form id="addForm">
<h3>Add New Course</h3>
<input id="title" placeholder="Course Name" required>
<textarea id="desc" placeholder="Description" required></textarea>
<button type="submit">Add Course</button>
</form>
<div id="courseList"></div>
<div id="editModal"><div id="editBox">
<h3>Edit Course</h3>
<input id="editTitle"><textarea id="editDesc"></textarea>
<input type="hidden" id="editId">
<button onclick="saveEdit()">Save</button>
<button onclick="closeModal()">Cancel</button>
</div></div>
<script>
const API="http://localhost:5000/api/courses";
async function load(){try{let r=await fetch(API);let d=await r.json();render(d);}catch(e){render([{id:1,title:"Sample Course",description:"Demo course - backend not connected"}]);}}
function render(courses){let el=document.getElementById("courseList");el.innerHTML="";courses.forEach(c=>{let div=document.createElement("div");div.className="course";div.innerHTML=`<h3>${c.title}</h3><p>${c.description||""}</p><button onclick="openEdit('${c.id}','${c.title}','${c.description||""}')">Edit</button><button class="delete" onclick="delCourse('${c.id}')">Delete</button>`;el.appendChild(div);});}
document.getElementById("addForm").addEventListener("submit",async e=>{e.preventDefault();let title=document.getElementById("title").value;let description=document.getElementById("desc").value;try{await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title,description})});}catch(e){}load();e.target.reset();});
async function delCourse(id){try{await fetch(API+"/"+id,{method:"DELETE"});}catch(e){}load();}
function openEdit(id,title,desc){document.getElementById("editId").value=id;document.getElementById("editTitle").value=title;document.getElementById("editDesc").value=desc;document.getElementById("editModal").style.display="block";}
function closeModal(){document.getElementById("editModal").style.display="none";}
async function saveEdit(){let id=document.getElementById("editId").value;let title=document.getElementById("editTitle").value;let description=document.getElementById("editDesc").value;try{await fetch(API+"/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({title,description})});}catch(e){}closeModal();load();}
load();
</script>
</body>
</html>
